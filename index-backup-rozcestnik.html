<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>TJ Sokol Řepy – objednávka oblečení 2026</title>

  <style>
    :root {
      --sp-dark: #082f16;
      --sp-green: #145214;
      --mp-dark: #17683e;
      --mp-green: #2d9b52;

      --page-bg: #f3f6f4;
      --ink: #15241c;
      --muted: #607067;
      --line: #dce6df;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 22px;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, #d8efe0 0, transparent 34%),
        linear-gradient(135deg, #f7fbf8, #e7f0e9);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    main {
      width: min(100%, 840px);
      padding: clamp(28px, 6vw, 58px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 20px 70px rgba(13, 62, 38, 0.16);
      text-align: center;
    }

    .club {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 99px;
      color: var(--sp-dark);
      background: #e7f4eb;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 12px;
      color: var(--sp-dark);
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.08;
    }

    .intro {
      max-width: 620px;
      margin: 0 auto 30px;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.55;
    }

    .teams {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .team-card {
      display: flex;
      min-height: 215px;
      padding: 28px;
      border-radius: 18px;
      color: #ffffff;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.13);
      text-align: left;
      text-decoration: none;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .team-card:hover,
    .team-card:focus-visible {
      outline: 3px solid #a4d8b4;
      outline-offset: 3px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.22);
      transform: translateY(-4px);
    }

    /* SP: tmavší zelená */
    .team-card.sp {
      background: linear-gradient(135deg, var(--sp-dark), var(--sp-green));
    }

    /* MP: světlejší zelená */
    .team-card.mp {
      background: linear-gradient(135deg, var(--mp-dark), var(--mp-green));
    }

    .team-code {
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    .team-name {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 850;
      line-height: 1.15;
    }

    .team-action {
      font-weight: 750;
    }

    .help {
      margin: 30px 0 0;
      color: #68776e;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    @media (max-width: 620px) {
      body {
        padding: 14px;
      }

      main {
        padding: 28px 20px;
      }

      .teams {
        grid-template-columns: 1fr;
      }

      .team-card {
        min-height: 165px;
      }
    }
  </style>
</head>

<body>
  <main>
    <span class="club">TJ Sokol Řepy</span>

    <h1>Objednávka klubového oblečení</h1>

    <p class="intro">
      Vyberte kategorii hráče a pokračujte do správného objednávkového e-shopu.
    </p>

    <div class="teams">
      <a class="team-card sp" href="sp/">
        <span class="team-code">SP</span>
        <span class="team-name">Starší přípravka</span>
        <span class="team-action">Otevřít objednávku →</span>
      </a>

      <a class="team-card mp" href="mp/">
        <span class="team-code">MP</span>
        <span class="team-name">Mladší přípravka</span>
        <span class="team-action">Otevřít objednávku →</span>
      </a>
    </div>

    <p class="help">
      Nejste si jistí, do které přípravky hráč patří?
      Obraťte se na trenéra své kategorie.
    </p>
  </main>
</body>
</html>
